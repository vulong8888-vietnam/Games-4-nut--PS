name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chuẩn bị file web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/

      - name: Cài Capacitor
        run: npm install

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Kiểm tra app hỗ trợ Android 10 trở lên
        run: |
          grep -n "minSdkVersion" android/variables.gradle
          MIN=$(grep -oE "minSdkVersion *= *[0-9]+" android/variables.gradle | grep -oE "[0-9]+$")
          if [ -z "$MIN" ] || [ "$MIN" -gt 29 ]; then
            echo "minSdkVersion=$MIN cao hơn Android 10 (API 29), app sẽ không cài được trên Android 10"
            exit 1
          fi
          echo "minSdkVersion=$MIN, chạy được trên Android 10"

      - name: Đặt biểu tượng tay cầm cho app
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
          RES=android/app/src/main/res
          for spec in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $spec
            mkdir -p "$RES/mipmap-$1"
            convert icon-only.png -resize "${2}x${2}" "$RES/mipmap-$1/ic_launcher.png"
            cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_round.png"
            convert icon-foreground.png -resize "${3}x${3}" "$RES/mipmap-$1/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0E0F1A</color>
          </resources>
          XML

      - name: Đồng bộ file web vào dự án Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk retro-player.apk

      - name: Lưu APK vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retro-player-apk
          path: retro-player.apk

      - name: Đăng APK lên mục Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest retro-player.apk \
            --title "Retro Player (bản mới nhất)" \
            --notes "Tải retro-player.apk về điện thoại Android và cài đặt."

